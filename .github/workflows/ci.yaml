name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: cd example && flutter pub get && flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run

  build-example:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: apk, args: --debug }
          - { os: ubuntu-latest, target: web, args: '' }
          - { os: ubuntu-latest, target: linux, args: --debug }
          - { os: windows-latest, target: windows, args: --debug }
          - { os: macos-latest, target: macos, args: --debug }
          - { os: macos-latest, target: ios, args: --debug --no-codesign }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev
      - working-directory: example
        run: flutter build ${{ matrix.target }} ${{ matrix.args }}
